version: 2
updates:
  # npm - group minor/patch into one PR per week to reduce noise;
  # major versions get individual PRs so they can be reviewed separately.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # eslint-config-next depends on eslint-plugin-react, which caps its eslint
      # peer at ^9. Under eslint 10 the plugin throws at rule-load time and
      # linting cannot run. Drop this once the plugin supports eslint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # nextra -> @shikijs/twoslash -> twoslash calls TypeScript's JS compiler
      # API, which the native TS 7 port does not expose, so the build dies in
      # the MDX loader. twoslash@0.3.9 (latest) pins its peer to
      # ^5.5.0 || ^6.0.0. Drop this once twoslash supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions - group all updates together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
